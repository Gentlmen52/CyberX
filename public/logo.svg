<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Orqa fon uchun tushadigan gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Geympad uchun neon gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Yonish effekti (Glow) -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Yumaloq orqa fon -->
  <circle cx="256" cy="256" r="240" fill="url(#bg-grad)" stroke="#a855f7" stroke-width="6" opacity="0.9"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Geympad (O'yin belgisi) -->
  <g filter="url(#glow)">
    <!-- Geympad korpusi -->
    <path d="M368 180H144c-35.3 0-64 28.7-64 64 0 23.7 12.9 44.3 32 55.4V344c0 13.3 10.7 24 24 24h24c13.3 0 24-10.7 24-24v-16h144v16c0 13.3 10.7 24 24 24h24c13.3 0 24-10.7 24-24v-44.6c19.1-11.1 32-31.7 32-55.4 0-35.3-28.7-64-64-64z" fill="url(#accent-grad)"/>

    <!-- D-Pad (Chap tomondagi plyus) -->
    <path d="M172 224h-16v-16c0-4.4-3.6-8-8-8h-16c-4.4 0-8 3.6-8 8v16h-16c-4.4 0-8 3.6-8 8v16c0 4.4 3.6 8 8 8h16v16c0 4.4 3.6 8 8 8h16c4.4 0 8-3.6 8-8v-16h16c4.4 0 8-3.6 8-8v-16c0-4.4-3.6-8-8-8z" fill="#ffffff" opacity="0.9"/>

    <!-- Tugmalar (O'ng tomondagi doiralar) -->
    <circle cx="348" cy="228" r="10" fill="#38bdf8"/>
    <circle cx="372" cy="252" r="10" fill="#f43f5e"/>
    <circle cx="324" cy="252" r="10" fill="#22c55e"/>
    <circle cx="348" cy="276" r="10" fill="#eab308"/>
  </g>
</svg>
